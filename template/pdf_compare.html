<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare PDFs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/applicant.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<header>
    <h2>AI Resume Screening System</h2>
    <a href="/">Home</a>
</header>

<main class="container">
    <h1>Compare Resume and Job Description</h1>
    <form action="{{ url_for('compare_pdfs') }}" method="POST" enctype="multipart/form-data">
        <label for="resume_pdf">Applicant resume PDF</label>
        <input id="resume_pdf" type="file" name="resume_pdf" accept=".pdf,application/pdf" required>

        <label for="job_description_pdf">Job description PDF</label>
        <input id="job_description_pdf" type="file" name="job_description_pdf" accept=".pdf,application/pdf" required>

        <label for="minimum_score">Minimum ATS score (%)</label>
        <input id="minimum_score" type="number" name="minimum_score" min="0" max="100" step="1" value="{{ minimum_score }}" required>

        <button type="submit">Compare PDFs</button>
    </form>
</main>
</body>
</html>
