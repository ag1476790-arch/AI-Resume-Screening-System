services:
  - type: web
    name: ai-resume-screening-system
    env: python
    region: oregon
    plan: free
    buildCommand: apt-get update && apt-get install -y tesseract-ocr && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0 $PORT app:app
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
